[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "img2tex-local"
version = "0.1.0"
description = "Local Windows formula OCR powered by Xiaomi-OCR-0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6==6.12.0", "Pillow==13.0.0", "transformers==5.17.0",
  "torch==2.14.0", "torchvision==0.29.0", "huggingface-hub>=1.0,<2",
  "latex2mathml==3.81.1", "mathml2omml==0.0.2", "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt>=4.4,<5", "pyinstaller==6.22.3", "ruff>=0.14,<1"]

[project.scripts]
img2tex = "img2tex.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
img2tex = ["assets/**/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["model: requires downloaded real model weights", "desktop: requires visible desktop"]

[tool.ruff]
target-version = "py312"
line-length = 110
